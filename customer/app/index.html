<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#D6155E">
<meta name="description" content="Foodies — Love Food. Love Life. Meet people who share your taste.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Yumble — Love Food. Love Life</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D6155E;
  --red-deep:#A50E48;
  --red-dark:#7A0A34;
  --coral:#F26D6D;
  --coral-soft:#F79A9A;
  --teal:#12B5A5;
  --ink:#1C2430;
  --slate:#5A6472;
  --mist:#EEF1F4;
  --line:#E4E8ED;
  --white:#ffffff;
  --gold:#D9A441;
  --shadow:0 10px 30px rgba(20,20,30,.14);
  --shadow-lg:0 24px 60px rgba(20,20,30,.28);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#2a2d33;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.script{font-family:'Pacifico',cursive;font-weight:400}

/* ---------- Phone frame ---------- */
#device{
  position:relative;
  width:min(430px,100vw);
  height:min(932px,100vh);
  background:var(--white);
  overflow:hidden;
  box-shadow:var(--shadow-lg);
}
@media(min-width:460px) and (min-height:960px){
  #device{border-radius:44px;border:12px solid #0d0d10;height:900px}
}
#screens{position:absolute;inset:0}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:translateX(24px);
  transition:opacity .32s ease,transform .32s ease,visibility .32s;
  background:var(--white);
}
.screen.active{opacity:1;visibility:visible;transform:none;z-index:2}
.screen.red-bg{background:var(--red)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

/* ---------- Shared UI ---------- */
.pad{padding:22px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.brandmark{font-family:'Pacifico',cursive;color:#fff;line-height:1}
.tag{letter-spacing:3px;font-size:11px;font-weight:700;color:rgba(255,255,255,.92)}
.tag b{color:#fff}
.btn{
  border:0;border-radius:16px;font-family:inherit;font-weight:700;font-size:16px;
  padding:16px 20px;cursor:pointer;width:100%;transition:transform .12s ease,filter .2s ease;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(216,0,25,.32)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(242,109,109,.36)}
.btn-white{background:#fff;color:var(--red)}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.btn-dark{background:var(--ink);color:#fff}
.btn-sm{padding:11px 16px;font-size:14px;border-radius:12px;width:auto}
.link{background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;opacity:.9}

/* Header bar (in-app) */
.appbar{
  background:var(--red);color:#fff;padding:16px 18px 14px;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
}
.appbar .script{font-size:26px}
.appbar h2{font-size:19px;font-weight:800;letter-spacing:.3px}
.appbar .back{background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;border-radius:11px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.appbar .spacer{flex:1}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1.5px solid var(--line);background:#fff;color:var(--slate);
  border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:all .15s ease;user-select:none;
}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.diet.on{background:var(--teal);border-color:var(--teal)}
.chip-static{background:var(--mist);border:0;color:var(--slate);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700}
.chip-static.hot{background:#FFE9E9;color:var(--red)}
.chip-static.teal{background:#DFF6F3;color:#0C8073}

/* Field */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:7px;letter-spacing:.2px}
.field input,.field select{
  width:100%;border:1.5px solid var(--line);border-radius:13px;padding:14px;font:inherit;font-size:15px;color:var(--ink);background:#fff;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--coral)}

/* progress */
.prog{height:5px;background:rgba(255,255,255,.28);border-radius:3px;overflow:hidden;margin:2px 0 0}
.prog.dark{background:var(--mist)}
.prog i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .4s ease}
.prog.dark i{background:var(--coral)}

/* ---------- Onboarding slides ---------- */
.ob{position:absolute;inset:0;display:none;flex-direction:column;justify-content:space-between;padding:0;background:var(--red)}
.ob.active{display:flex;animation:fade .4s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Swipe deck ---------- */
#deck{flex:1;position:relative;padding:14px 14px 0}
.card{
  position:absolute;inset:14px 14px 0;border-radius:24px;overflow:hidden;
  background:#333;box-shadow:var(--shadow-lg);will-change:transform;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.35) 42%,rgba(0,0,0,0) 68%)}
.card .body{position:relative;padding:18px 20px 20px;color:#fff}
.card .name{font-size:25px;font-weight:800;display:flex;align-items:center;gap:8px}
.card .name .vf{font-size:15px;color:#4FC3F7}
.card .meta{font-size:13.5px;opacity:.92;margin:4px 0 10px;display:flex;gap:12px;flex-wrap:wrap}
.card .prompt{background:rgba(255,255,255,.14);backdrop-filter:blur(4px);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:11px;border:1px solid rgba(255,255,255,.15)}
.card .prompt b{display:block;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.card .cui{display:flex;flex-wrap:wrap;gap:6px}
.card .cui span{background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.card .cui span.shared{background:var(--teal);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.stamp{position:absolute;top:26px;font-size:30px;font-weight:800;letter-spacing:2px;padding:6px 16px;border-radius:12px;border:4px solid;opacity:0;transform:rotate(-14deg);z-index:5}
.stamp.like{left:20px;color:var(--teal);border-color:var(--teal)}
.stamp.nope{right:20px;color:var(--coral);border-color:var(--coral)}
.match-badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;background:var(--teal);color:#fff;font-size:11px;font-weight:800;letter-spacing:.5px;padding:6px 13px;border-radius:999px;box-shadow:0 6px 14px rgba(18,181,165,.4)}
.fmbadge{position:absolute;top:14px;right:14px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:3px}
.fmring{width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),rgba(255,255,255,.3) 0);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fmring>span{width:46px;height:46px;border-radius:50%;background:rgba(20,24,32,.82);color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fmring small{font-size:9px;margin-left:1px}
.fmlbl{font-size:9px;font-weight:800;color:#fff;text-align:center;line-height:1.1;text-shadow:0 1px 3px rgba(0,0,0,.6);letter-spacing:.3px}
.tonight-badge{position:absolute;top:16px;left:14px;z-index:6;background:rgba(18,181,165,.95);color:#fff;font-size:11px;font-weight:800;padding:6px 11px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.infobtn{position:absolute;bottom:118px;right:16px;z-index:7;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);border:0;font-size:16px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.prompt-card{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.prompt-card b{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--coral);font-weight:800}
.prompt-card p{font-size:15px;margin-top:5px;color:var(--ink);line-height:1.4}
.verdict{flex:1;border:2px solid var(--line);background:#fff;border-radius:18px;padding:20px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit}
.verdict b{font-size:15px;color:var(--ink)}.verdict small{font-size:11px;color:var(--slate)}
.verdict:active{transform:scale(.97)}
.spinner{width:52px;height:52px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hub-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:#FFF3F3;border:1px solid #F8D7D7;border-radius:14px;padding:12px 6px;cursor:pointer;font-size:20px;color:var(--red)}
.hub-btn span{font-size:11.5px;font-weight:700}
.checkrow{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--mist);font-size:14px;line-height:1.45;cursor:pointer}
.checkrow input{width:22px;height:22px;flex-shrink:0;accent-color:var(--red);margin-top:1px}
.checkrow u{color:var(--red);cursor:pointer}
.otp-row{display:flex;gap:9px;justify-content:space-between;margin-top:8px}
.otp-box{width:100%;aspect-ratio:1;text-align:center;font-size:24px;font-weight:800;border:1.5px solid var(--line);border-radius:12px;color:var(--ink)}
.otp-box:focus{outline:none;border-color:var(--red)}

/* ---------- TikTok-style vertical feed ---------- */
.feed-topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent);color:#fff}
.feed-topbar .script{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.feed-top-btn{background:rgba(255,255,255,.18);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;backdrop-filter:blur(4px)}
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;background:#000}
.feed::-webkit-scrollbar{width:0}
.feed-item{position:relative;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111}
.feed-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feed-veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.15) 42%,rgba(0,0,0,.25) 100%)}
.feed-rail{position:absolute;right:12px;bottom:120px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:20px}
.rail-btn{background:none;border:0;color:#fff;font-size:26px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.rail-btn span{font-size:11px;font-weight:700}
.rail-btn:active{transform:scale(.86)}
.rail-heart{width:56px;height:56px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 16px rgba(216,0,25,.5)}
.rail-btn.pass{font-size:24px}.rail-btn.super{color:var(--gold)}.rail-btn.info{font-size:24px}
.rail-fm{margin-top:2px}
.rail-fm .fmring{width:52px;height:52px}
.rail-fm .fmring>span{width:42px;height:42px;font-size:15px}
.feed-info{position:absolute;left:18px;right:84px;bottom:104px;z-index:9;color:#fff}
.feed-name{font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.feed-name .vf{font-size:15px;color:#4FC3F7}
.feed-meta{font-size:13.5px;opacity:.95;margin:5px 0 10px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.feed-prompt{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:11px 13px;font-size:13.5px;margin-bottom:11px;line-height:1.4}
.feed-prompt b{display:block;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.feed-cui{display:flex;flex-wrap:wrap;gap:7px}
.feed-cui span{background:rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;backdrop-filter:blur(4px)}
.feed-cui span.shared{background:var(--teal);box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.feed-item.fly-left{animation:flyL .42s ease forwards}
.feed-item.fly-right{animation:flyR .42s ease forwards}
.feed-item.fly-up{animation:flyU .42s ease forwards}
@keyframes flyL{to{transform:translateX(-100%) rotate(-8deg);opacity:0}}
@keyframes flyR{to{transform:translateX(100%) rotate(8deg);opacity:0}}
@keyframes flyU{to{transform:translateY(-100%);opacity:0}}
.heart-burst{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;color:var(--red);z-index:15;animation:burst .5s ease forwards;pointer-events:none;text-shadow:0 4px 20px rgba(0,0,0,.4)}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(0);opacity:0}40%{transform:translate(-50%,-50%) scale(1.1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.feed-hint{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);z-index:8;color:#fff;font-size:12px;opacity:.7;display:flex;flex-direction:column;align-items:center;gap:2px;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}

/* ---------- "sign-up is cooking" animation ---------- */
.cooking-pot{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.pot{font-size:72px;animation:potbob 2.2s ease-in-out infinite}
@keyframes potbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.pot-steam{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:2}
.pot-steam span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.7);animation:steam 2.4s ease-in-out infinite}
.pot-steam span:nth-child(2){animation-delay:.5s}
.pot-steam span:nth-child(3){animation-delay:1s}
@keyframes steam{0%{transform:translateY(20px) scale(.6);opacity:0}30%{opacity:.9}100%{transform:translateY(-30px) scale(1.6);opacity:0}}
.mini-spin{width:14px;height:14px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#5EEAD4;border-radius:50%;display:inline-block;animation:spin .9s linear infinite;flex-shrink:0}
#deckEmpty{position:absolute;inset:14px 14px 0;border-radius:24px;background:var(--mist);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--slate)}

/* deck action bar */
.actions{display:flex;gap:14px;align-items:center;justify-content:center;padding:16px 0 8px}
.act{border:0;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:var(--shadow);transition:transform .12s}
.act:active{transform:scale(.9)}
.act.sm{width:50px;height:50px;font-size:20px}
.act.lg{width:64px;height:64px;font-size:26px}
.act.nope{color:var(--coral)} .act.like{color:var(--teal)} .act.star{color:var(--gold)} .act.rewind{color:#7C8698}

/* bottom nav */
.tabbar{
  display:flex;background:#fff;border-top:1px solid var(--line);flex-shrink:0;
  padding-bottom:var(--safe-b);
}
.tabbar button{flex:1;background:none;border:0;padding:11px 0 10px;cursor:pointer;color:#9AA3B0;font-size:22px;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button span{font-size:10px;font-weight:700}
.tabbar button.on{color:var(--red)}
.tabbar button .dot{position:absolute;top:6px;right:calc(50% - 18px);background:var(--coral);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* Match overlay */
#matchOverlay{position:absolute;inset:0;z-index:60;background:linear-gradient(160deg,var(--red),var(--red-dark));display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:#fff}
#matchOverlay.show{display:flex;animation:fade .35s}
.match-photos{display:flex;justify-content:center;margin:8px 0 20px}
.match-photos .mp{width:118px;height:118px;border-radius:50%;border:4px solid #fff;object-fit:cover;box-shadow:var(--shadow-lg)}
.match-photos .mp:last-child{margin-left:-26px}
.confetti{position:absolute;width:9px;height:14px;border-radius:2px;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg);opacity:.2}}

/* explore cards */
.vcard{display:flex;gap:12px;border:1px solid var(--line);border-radius:18px;padding:11px;margin-bottom:13px;cursor:pointer;background:#fff;transition:transform .12s,box-shadow .2s}
.vcard:active{transform:scale(.99)}
.vcard img{width:92px;height:92px;border-radius:13px;object-fit:cover;flex-shrink:0}
.vcard .vc{flex:1;min-width:0}
.vcard .vn{font-weight:800;font-size:15.5px}
.vcard .vsub{font-size:12.5px;color:var(--slate);margin:2px 0 7px;display:flex;gap:9px;flex-wrap:wrap}
.rowb{display:flex;gap:6px;flex-wrap:wrap}
.offer{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:7px;letter-spacing:.2px}

/* section head */
.shead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px}
.shead h3{font-size:17px;font-weight:800}
.shead .more{color:var(--coral);font-size:13px;font-weight:700;cursor:pointer;background:none;border:0}

/* chat list */
.crow{display:flex;gap:13px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--mist);cursor:pointer}
.crow img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.crow .ci{flex:1;min-width:0}
.crow .cn{font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.crow .cn small{font-weight:500;color:#9AA3B0;font-size:11px}
.crow .cm{font-size:13px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.crow .badge{background:var(--coral);color:#fff;font-size:10px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* chat thread */
#thread{flex:1;overflow-y:auto;padding:16px;background:#FAFBFC;display:flex;flex-direction:column;gap:9px}
.bub{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.4}
.bub.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.bub.me{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bub.venue{align-self:flex-start;padding:0;overflow:hidden;background:#fff;border:1px solid var(--line);width:80%;border-radius:16px}
.bub.venue img{width:100%;height:96px;object-fit:cover;display:block}
.bub.venue .vb{padding:10px 12px}
.bub.venue .vb b{font-size:14px}
.bub.venue .vb p{font-size:11.5px;color:var(--slate);margin:2px 0 8px}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px;padding:13px 16px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#B7BFC9;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

.toast{position:absolute;bottom:calc(80px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;transition:all .3s;z-index:70;white-space:nowrap;box-shadow:var(--shadow)}

/* map */

/* video call */

.callbtn.end{background:#E23B3B}

/* safety toolkit */

.switch.on i{left:21px}

<body>
<div id="device">
  <div id="screens"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="venues.js"></script>
<script src="firebase-config.js"></script>
<script>

// ---- Sample data ---------------------------------------------------
const CUISINES = ["Italian","Indian","Japanese","Lebanese","Chinese","Thai","Mexican","French","Korean","Turkish","Greek","Spanish","Vietnamese","Ethiopian"];
const DIETS = ["Halal","Kosher","Vegan","Vegetarian","Gluten-free","Pescatarian"];

const me = { name:"You", cuisines:["Italian","Japanese","Lebanese"], diets:["Halal"],
  age:null, gender:null, lookingFor:null, agreedTerms:false,
  accountStatus:"new", // new → pending (awaiting admin) → approved
  taste:{spice:2,adventure:2,sweet:1,dining:1}, // 0-3 scales; set by the food game
  foodieType:"Explorer", badges:["verified"], cuisinesTried:3 };
// taste axes: spice(mild→fire), adventure(comfort→adventurous), sweet(savoury→sweettooth), dining(homecook→restaurant)

const FOODIES = [
  {id:1,name:"Amara",age:27,dist:"1.2 mi",looking:"Relationship",verified:true,
   img:"img/p4.jpg", tonight:true, foodieType:"Comfort seeker",
   taste:{spice:1,adventure:1,sweet:2,dining:2},
   dish:"img/rv6.jpg",
   cuisines:["Italian","Lebanese","Thai"],
   prompt:{q:"My go-to comfort dish",a:"A proper bowl of cacio e pepe on a rainy night."},
   prompt2:{q:"Death-row dessert",a:"Tiramisu. No debate."}},
  {id:2,name:"Priya",age:29,dist:"0.8 mi",looking:"Something casual",verified:true,
   img:"img/p1.jpg", tonight:true, foodieType:"Adventurer",
   taste:{spice:3,adventure:3,sweet:1,dining:1},
   dish:"img/rv7.jpg",
   cuisines:["Indian","Japanese","Korean"],
   prompt:{q:"Order for the table or your own?",a:"Order for the table — always. Sharing is the whole point."},
   prompt2:{q:"Spice tolerance",a:"Bring the ghost chilli. I'll finish yours too."}},
  {id:3,name:"Sofia",age:25,dist:"2.4 mi",looking:"Relationship",verified:false,
   img:"img/p16.jpg", tonight:false, foodieType:"Explorer",
   taste:{spice:2,adventure:3,sweet:2,dining:3},
   dish:"img/rv5.jpg",
   cuisines:["Japanese","Italian","French"],
   prompt:{q:"Best meal you've had this year",a:"Omakase in Soho. I still think about the uni."},
   prompt2:{q:"My weakness",a:"A tasting menu with wine pairing."}},
  {id:4,name:"Leila",age:31,dist:"3.1 mi",looking:"New friends",verified:true,
   img:"img/p13.jpg", tonight:false, foodieType:"Sweet tooth",
   taste:{spice:2,adventure:2,sweet:3,dining:2},
   dish:"img/rv4.jpg",
   cuisines:["Lebanese","Turkish","Greek"],
   prompt:{q:"Sweet or savoury?",a:"Both, at once, no notes. Baklava counts as breakfast."},
   prompt2:{q:"Hosting or going out?",a:"Come to mine — I'll feed you til you can't move."}},
  {id:5,name:"Chloé",age:26,dist:"1.9 mi",looking:"Relationship",verified:true,
   img:"img/p8.jpg", tonight:true, foodieType:"Restaurant explorer",
   taste:{spice:1,adventure:2,sweet:2,dining:3},
   dish:"img/rv8.jpg",
   cuisines:["French","Italian","Spanish"],
   prompt:{q:"Dream dinner guest",a:"Someone who'll split a bottle and stay for dessert."},
   prompt2:{q:"Perfect date",a:"Aperitivo, then somewhere we've never tried."}}
];

// Full London dataset from venues.js — normalise fields the app expects
const MY_LOC = {lat:51.5074,lng:-0.1278,label:"Central London"}; // default "me" location
function haversineMi(a,b){const R=3959;const dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;const la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return R*2*Math.asin(Math.sqrt(x));}
const VENUES = (window.LONDON_VENUES||[]).map(v=>({
  ...v,
  area:v.area+", London",
  addr:v.area+" · "+v.postcode,
  dist:haversineMi(MY_LOC,{lat:v.lat,lng:v.lng}).toFixed(1)+" mi",
  distMi:haversineMi(MY_LOC,{lat:v.lat,lng:v.lng})
}));

// shared-cuisine helper
const shared = (a,b)=>a.filter(c=>b.includes(c));

/* ---------- FLAVOUR MATCH % (signature) ---------- */
function flavourMatch(f){
  // cuisine overlap (0-45), taste-axis closeness (0-40), dietary fit (0-15)
  const sh=shared(me.cuisines,f.cuisines).length;
  const cuiScore=Math.min(45, sh*18);
  let axisDist=0;
  ["spice","adventure","sweet","dining"].forEach(k=>{axisDist+=Math.abs((me.taste[k]??1.5)-(f.taste[k]??1.5));});
  const axisScore=Math.round(40*(1-axisDist/12)); // max dist 12
  const dietScore=me.diets.length? (me.diets.some(d=>true)?12:0):10;
  let pct=Math.round(cuiScore+axisScore+dietScore);
  pct=Math.max(58,Math.min(99,pct)); // keep it flattering-but-varied
  return pct;
}
function matchReason(f){
  const sh=shared(me.cuisines,f.cuisines);
  if(sh.length>=2)return `You both love ${sh.slice(0,2).join(" & ")}`;
  if(f.taste.spice>=3&&me.taste.spice>=2)return "You can both take the heat 🌶️";
  if(f.taste.sweet>=3)return "A fellow dessert-first Foodie 🍰";
  if(f.taste.adventure>=3)return "Two adventurous palates 🌍";
  if(sh.length===1)return `You share a love of ${sh[0]}`;
  return "Worth a taste 😋";
}
const FOODIE_TYPES={
  "Explorer":"🧭","Adventurer":"🌶️","Comfort seeker":"🍜","Sweet tooth":"🍰","Restaurant explorer":"🍽️","Home cook":"👨‍🍳"
};

/* ---------- BADGES / PASSPORT ---------- */
const ALL_BADGES=[
  {id:"verified",icon:"✅",name:"Verified",desc:"Photo verified — a genuine Foodie"},
  {id:"firstmatch",icon:"💘",name:"First Match",desc:"Made your first Foodie match"},
  {id:"explorer",icon:"🌍",name:"Globe Trotter",desc:"Liked 5+ cuisines"},
  {id:"booker",icon:"📅",name:"Table Booker",desc:"Booked your first table"},
  {id:"social",icon:"👥",name:"Social Butterfly",desc:"Joined a group meet-up"},
  {id:"dessert",icon:"🍨",name:"Dessert Club",desc:"Always orders dessert"},
  {id:"spicy",icon:"🌶️",name:"Heat Seeker",desc:"Spice level: fire"},
  {id:"nightowl",icon:"🌙",name:"Spontaneous",desc:"Used Eat Tonight"}
];
function awardBadge(id){
  if(me.badges.includes(id))return;
  me.badges.push(id);
  const b=ALL_BADGES.find(x=>x.id===id);
  if(b){toast(`${b.icon} Badge unlocked: ${b.name}`);notify(`Badge unlocked ${b.icon}`,b.name+" — "+b.desc);}
}

// ---- App state -----------------------------------------------------
const state = {
  step:0,             // onboarding step
  selCuisines:[...me.cuisines],
  selDiets:[...me.diets],
  deckIdx:0,
  lastSwiped:null,
  matches:[],         // foodie objects matched
  activeChat:null,
  threads:{},         // id -> [{who,text,venue}]
  bookingVenue:null,
  bookDate:0,bookSlot:null,bookGuests:2,
  tab:"discover",
  tier:"free",
  radius:5, exFilter:"all", exDiets:[], exView:"list", searchCentre:null, searchLabel:null,
  groups:[], liked:[], passed:[], likedMe:[2,3,4], eventsBooked:[], verified:false,
  myBookings:[
    {venueId:2,date:"Sat 9 Aug",time:"7:30pm",guests:2,withName:"Priya",when:"upcoming"},
    {venueId:8,date:"Thu 3 Jul",time:"8:00pm",guests:2,withName:"a match",when:"past"},
    {venueId:5,date:"Fri 20 Jun",time:"7:00pm",guests:4,withName:null,when:"past"}
  ]
};

// seed one existing match + chat so the app isn't empty
state.matches.push(FOODIES[1]);
state.threads[FOODIES[1].id]=[
  {who:"them",text:"Hey! Saw we both can't say no to Japanese 🍣"},
  {who:"me",text:"Guilty. Omakase or ramen person?"},
  {who:"them",text:"Both, obviously. Where are you thinking?"}
];

const $=(s,r=document)=>r.querySelector(s);
const screensEl=$("#screens");

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1900);}

// ---- Screen router -------------------------------------------------
const routes={};
function route(name,builder){routes[name]=builder;}
let current=null;
function go(name,opts){
  const html=routes[name](opts||{});
  let el=document.createElement("div");
  el.className="screen"+(routes[name].red?" red-bg":"");
  el.innerHTML=html;
  el.id="scr-"+name;
  // remove old same-id
  const old=$("#scr-"+name);if(old)old.remove();
  screensEl.appendChild(el);
  requestAnimationFrame(()=>{
    document.querySelectorAll(".screen.active").forEach(s=>{if(s!==el)s.classList.remove("active")});
    el.classList.add("active");
  });
  if(routes[name].after)routes[name].after(el,opts||{});
  current=name;
  setTimeout(()=>{document.querySelectorAll(".screen").forEach(s=>{if(!s.classList.contains("active")&&s!==el)s.remove();});},400);
}

/* =========================================================
   ONBOARDING
   ========================================================= */

route("signup",()=>`
  <div class="scroll center red-bg" style="padding:44px 30px">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%">

      <p style="color:#fff;font-size:12px;letter-spacing:2px;font-weight:700;margin-bottom:18px">SIGN UP WITH</p>
      <button class="btn btn-white" style="margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px" onclick="googleSignup()">

/* onboarding validation + helpers */
function checkDetails(){
  const n=document.getElementById("f_name")?.value.trim();
  const dob=document.getElementById("f_dob")?.value;
  const g=document.getElementById("f_gender")?.value;
  const l=document.getElementById("f_looking")?.value;
  const loc=document.getElementById("f_loc")?.value.trim();
  let over18=false;
  if(dob){const d=new Date(dob);const age=(Date.now()-d)/(365.25*24*3600*1000);over18=age>=18;const err=document.getElementById("ageErr");if(err)err.style.display=(dob&&!over18)?"block":"none";}
  const ok=n&&dob&&over18&&g&&l&&loc;
  const btn=document.getElementById("obBtn");if(btn){btn.disabled=!ok;btn.style.opacity=ok?1:.5;}
}
function saveDetails(){
  me.name=document.getElementById("f_name").value.trim()||"You";
  me.gender=document.getElementById("f_gender").value;
  me.lookingFor=document.getElementById("f_looking").value;
  const dob=document.getElementById("f_dob").value;if(dob)me.age=Math.floor((Date.now()-new Date(dob))/(365.25*24*3600*1000));
  obNext();
}
function checkTerms(){
  const all=["t_age","t_terms","t_gdpr","t_comm"].every(id=>document.getElementById(id)?.checked);
  const btn=document.getElementById("obBtn");if(btn){btn.disabled=!all;btn.style.opacity=all?1:.5;}
  me.agreedTerms=all;
}
function otpInput(el){const i=+el.dataset.i;if(el.value&&i<5){document.querySelector(`.otp-box[data-i="${i+1}"]`)?.focus();}}
function verifyOtp(){
  const code=[...document.querySelectorAll(".otp-box")].map(b=>b.value).join("");
  if(code.length<6){toast("Enter the 6-digit code");return;}
  toast("Number verified ✓");obNext();
}
function addPhoto(i){toast("Photo added (demo)");}
function submitVerification(){
  me.accountStatus="pending";
  go("onboard"); // shows submitting spinner
  state.step=OB_STEPS.indexOf("submitting");go("onboard");
  setTimeout(()=>{go("verifyPending");},2200);
}

/* ---------- THIS-OR-THAT TASTE GAME ---------- */
const GAME_Q=[
  {axis:"dining", a:{t:"Cosy home cooking",e:"🏠",v:0}, b:{t:"Try a new restaurant",e:"🍽️",v:3}},
  {axis:"spice",  a:{t:"Keep it mild",e:"🥛",v:0}, b:{t:"Bring the heat",e:"🌶️",v:3}},
  {axis:"adventure", a:{t:"My usual favourite",e:"🍝",v:0}, b:{t:"Something I've never had",e:"🐙",v:3}},
  {axis:"sweet",  a:{t:"Skip to the cheese board",e:"🧀",v:0}, b:{t:"Always order dessert",e:"🍰",v:3}},
  {axis:"dining", a:{t:"Street food & small plates",e:"🌮",v:1}, b:{t:"Tasting menu night",e:"🍾",v:3}}
];
let gameIdx=0, gameAcc={};
function renderGame(){
  gameIdx=0; gameAcc={spice:[],adventure:[],sweet:[],dining:[]};
  paintGameQ();
}
function paintGameQ(){
  const area=$("#gameArea"); if(!area)return;
  if(gameIdx>=GAME_Q.length){
    // finalise taste
    ["spice","adventure","sweet","dining"].forEach(k=>{
      const arr=gameAcc[k]; if(arr.length)me.taste[k]=Math.round(arr.reduce((x,y)=>x+y,0)/arr.length);
    });
    me.foodieType = me.taste.adventure>=2.5?"Adventurer":me.taste.sweet>=2.5?"Sweet tooth":me.taste.dining>=2.5?"Restaurant explorer":me.taste.spice>=2.5?"Heat seeker":"Comfort seeker";
    if(me.taste.spice>=3)awardBadge("spicy");
    area.innerHTML=`
      <div class="center" style="padding:10px 0">
        <div style="font-size:52px;margin-bottom:8px">${FOODIE_TYPES[me.foodieType]||"🍴"}</div>
        <div style="font-size:12px;font-weight:700;letter-spacing:1px;color:var(--slate)">YOUR FOODIE TYPE</div>
        <h2 style="font-size:26px;font-weight:800;color:var(--red);margin:4px 0 14px">${me.foodieType}</h2>
        ${tasteBars(me.taste)}
        <button class="btn btn-coral" style="margin-top:22px" onclick="obNext()">Looks right →</button>
        <button class="link" style="margin-top:12px;color:var(--slate)" onclick="renderGame()">Retake</button>
      </div>`;
    return;
  }
  const q=GAME_Q[gameIdx];
  area.innerHTML=`
    <div style="text-align:center;font-size:12px;font-weight:700;color:var(--slate);margin-bottom:14px">${gameIdx+1} of ${GAME_Q.length}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${[q.a,q.b].map((o,i)=>`
        <button onclick="pickGame(${o.v},'${q.axis}')" style="border:2px solid var(--line);background:#fff;border-radius:20px;padding:26px 14px;cursor:pointer;transition:transform .1s;display:flex;flex-direction:column;align-items:center;gap:12px" onmousedown="this.style.transform='scale(.96)'" onmouseup="this.style.transform=''">
          <span style="font-size:46px">${o.e}</span>
          <span style="font-weight:700;font-size:14px;color:var(--ink);line-height:1.3">${o.t}</span>
        </button>`).join("")}
    </div>
    <p class="h-sub" style="text-align:center;margin-top:18px">Tap the one that's more <b>you</b></p>`;
}
function pickGame(v,axis){gameAcc[axis].push(v);gameIdx++;paintGameQ();}
function tasteBars(t){
  const rows=[["🌶️","Spice",t.spice],["🌍","Adventure",t.adventure],["🍰","Sweet tooth",t.sweet],["🍽️","Dining out",t.dining]];
  return `<div style="width:100%;max-width:300px;text-align:left">${rows.map(([e,l,v])=>`
    <div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px"><span>${e} ${l}</span></div>
      <div style="height:8px;background:var(--mist);border-radius:4px;overflow:hidden"><div style="height:100%;width:${(v/3)*100}%;background:linear-gradient(90deg,var(--coral),var(--red));border-radius:4px"></div></div>
    </div>`).join("")}</div>`;
}

function toggleCui(el,c){el.classList.toggle("on");const i=state.selCuisines.indexOf(c);if(i<0)state.selCuisines.push(c);else state.selCuisines.splice(i,1);me.cuisines=state.selCuisines;}
function toggleDiet(el,d){el.classList.toggle("on");const i=state.selDiets.indexOf(d);if(i<0)state.selDiets.push(d);else state.selDiets.splice(i,1);me.diets=state.selDiets;}

function updateNavBadges(){
  const set=(tab,n)=>{const btn=document.querySelector(`#tabbar [data-tab="${tab}"]`);if(!btn)return;let d=btn.querySelector(".dot");if(n>0){if(!d){d=document.createElement("span");d.className="dot";btn.appendChild(d);}d.textContent=n;}else if(d)d.remove();};
  // matches badge = mutual matches not yet chatted + people who like you
  const newMatches=state.matches.filter(m=>!state.threads[m.id]).length;
  set("matches", newMatches + state.likedMe.filter(id=>!state.matches.find(m=>m.id===id)).length);
  const unreadChats=state.matches.filter(m=>state.threads[m.id]&&state.threads[m.id].some(x=>x.unread)).length;
  set("chats", unreadChats);
}

/* ---------- venue matching logic (signature) ---------- */
function bestVenuesFor(f){
  const wantCui=[...new Set([...shared(me.cuisines,f.cuisines),...me.cuisines])];
  const wantDiet=me.diets;
  return [...VENUES].map(v=>{
    let score=0;
    v.cuisines.forEach(c=>{if(wantCui.includes(c))score+=wantCui.includes(c)&&shared(me.cuisines,f.cuisines).includes(c)?3:1;});
    if(wantDiet.every(d=>v.diets.includes(d)))score+=2;
    if(v.offer)score+=1;
    return {...v,score};
  }).sort((a,b)=>b.score-a.score);
}

function filteredVenues(){
  const c=state.searchCentre||MY_LOC;
  let list=VENUES.map(v=>({...v,d:haversineMi(c,{lat:v.lat,lng:v.lng})}));
  list=list.filter(v=>v.d<=state.radius);
  if(state.exFilter==='offers')list=list.filter(v=>v.offer);
  if(state.exFilter==='forme')list=list.filter(v=>shared(me.cuisines,v.cuisines).length>0);
  if(state.exDiets.length)list=list.filter(v=>state.exDiets.every(d=>v.diets.includes(d)));
  list.sort((a,b)=>{
    if(state.exFilter==='forme')return shared(me.cuisines,b.cuisines).length-shared(me.cuisines,a.cuisines).length||a.d-b.d;
    return a.d-b.d;
  });
  return list;
}
function renderExploreBody(){
  const body=$("#exploreBody");if(!body)return;
  const list=filteredVenues();
  const where=state.searchLabel?`near <b>${state.searchLabel}</b>`:`near you`;
  if(state.exView==='map'){body.innerHTML=renderMap(list);return;}
  if(list.length===0){body.innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--slate)"><div style="font-size:38px;margin-bottom:10px">🔍</div><b style="color:var(--ink)">No venues in range</b><p style="margin-top:6px;font-size:13px">Try widening the radius or clearing filters.</p></div>`;return;}
  body.innerHTML=`<p class="h-sub" style="margin:-4px 0 14px">${list.length} ${list.length===1?'venue':'venues'} ${where}, closest first.</p>`+list.map(v=>venueCard(v)).join("");
}
function venueCard(v){
  const sh=shared([...me.cuisines],v.cuisines);
  const dist=(v.d!=null?v.d.toFixed(1):v.distMi.toFixed(1))+" mi";
  return `<div class="vcard" onclick="openVenue(${v.id})">
    <img src="${v.img}">
    <div class="vc">
      <div class="vn">${v.name}</div>
      <div class="vsub"><span>⭐ ${v.rating}</span><span>📍 ${v.area.replace(', London','')}</span><span>${dist}</span><span>${v.price}</span></div>
      <div class="rowb">${v.offer?`<span class="offer">🎁 ${v.offer}</span>`:''}${v.cuisines.slice(0,2).map(c=>`<span class="chip-static ${sh.includes(c)?'teal':''}">${c}</span>`).join("")}</div>
    </div></div>`;
}
// simple schematic map (no external tiles — self-contained)
function renderMap(list){
  const c=state.searchCentre||MY_LOC;
  // project lat/lng to a local box
  const pad=0.02;
  const lats=list.map(v=>v.lat).concat(c.lat),lngs=list.map(v=>v.lng).concat(c.lng);
  const minLat=Math.min(...lats)-pad,maxLat=Math.max(...lats)+pad,minLng=Math.min(...lngs)-pad,maxLng=Math.max(...lngs)+pad;
  const X=lng=>((lng-minLng)/(maxLng-minLng))*100;
  const Y=lat=>(1-(lat-minLat)/(maxLat-minLat))*100;
  const pins=list.map(v=>`<button class="pin" style="left:${X(v.lng)}%;top:${Y(v.lat)}%" onclick="openVenue(${v.id})" title="${v.name}">
     <span class="pindot">${v.offer?'🎁':'🍽️'}</span><span class="pinlbl">${v.name.split(' ')[0]}</span></button>`).join("");
  return `
    <div class="mapbox">
      <div class="mapgrid"></div>
      <div class="pin me" style="left:${X(c.lng)}%;top:${Y(c.lat)}%"><span class="pindot" style="background:var(--ink)">📍</span></div>
      ${pins}
    </div>
    <p class="h-sub" style="margin-top:12px;text-align:center">${list.length} venues shown · tap a pin to view. <br><span style="opacity:.7">Schematic map — live maps come with the full build.</span></p>`;
}

function runSearch(){
  const raw=($("#pcInput")?.value||"").trim().toUpperCase();
  if(!raw){state.searchCentre=null;state.searchLabel=null;renderExploreBody();return;}
  // try postcode district match, then area-name match
  const cent=window.POSTCODE_CENTROIDS;
  let key=Object.keys(cent).find(k=>raw.replace(/\s/g,'').startsWith(k)&&k!=="LONDON");
  if(key){state.searchCentre={lat:cent[key][0],lng:cent[key][1]};state.searchLabel=key;}
  else{
    const v=VENUES.find(x=>x.area.toUpperCase().includes(raw)||x.postcode.toUpperCase().startsWith(raw));
    if(v){state.searchCentre={lat:v.lat,lng:v.lng};state.searchLabel=v.area.replace(', London','');}
    else{toast("Try a London postcode like E1 or an area like Soho");return;}
  }
  renderExploreBody();
  toast("Showing venues near "+state.searchLabel);
}

function isStandalone(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}

function showInstallBar(){
  if(isStandalone()||document.getElementById("installBar"))return;
  const b=document.createElement("div");b.id="installBar";
  b.innerHTML=`<div style="display:flex;align-items:center;gap:12px">
     <img src="icon-192.png" style="width:40px;height:40px;border-radius:11px">

     <button onclick="doInstall()" style="background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer">Install</button>
     <button onclick="hideInstallBar()" style="background:none;border:0;font-size:20px;color:#9AA3B0;cursor:pointer">×</button>
   </div>`;
  Object.assign(b.style,{position:"absolute",left:"12px",right:"12px",bottom:"calc(12px + var(--safe-b))",background:"#fff",borderRadius:"16px",padding:"12px 14px",boxShadow:"var(--shadow-lg)",zIndex:80});
  document.getElementById("device").appendChild(b);
}
function hideInstallBar(){const b=document.getElementById("installBar");if(b)b.remove();}
function doInstall(){
  if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;hideInstallBar();});}
  else if(isIOS()){showIOSInstall();}

}
function showIOSInstall(){
  const m=document.createElement("div");m.id="iosSheet";

    <img src="icon-192.png" style="width:56px;height:56px;border-radius:15px;margin-bottom:10px">

    <button onclick="document.getElementById('iosSheet').remove()" class="btn btn-coral" style="margin-top:16px">Got it</button></div>`;
  Object.assign(m.style,{position:"absolute",inset:0,background:"rgba(0,0,0,.45)",zIndex:90,display:"flex",alignItems:"flex-end"});

// Notification permission — asked at a natural moment (after first match / entering app)
function askNotifications(){
  if(!("Notification" in window))return;

  if(sessionStorage.getItem("notifAsked"))return;
  sessionStorage.setItem("notifAsked","1");

      <div class="gmeta"><span>📍 ${v.name}</span><span>🗓️ ${e.date}</span><span>🕐 ${e.time}</span></div>
      <div class="gmeta"><span>🍽️ ${e.menu}</span></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
        <span class="offer" style="background:var(--teal)">Free entry</span>
        <span class="chip-static">Menu £${e.menuPrice}pp</span>
        <span style="font-size:12px;color:var(--slate);margin-left:auto">${e.going}/${e.spots} going</span>
      </div>
    </div></div>`;
}
function openEvent(id){go("event",{id});}
route("event",({id})=>{
  const e=EVENTS.find(x=>x.id===id);const v=VENUES.find(x=>x.id===e.venueId);const booked=state.eventsBooked.includes(e.id);
  return `
    <div class="scroll" style="background:#fff">
      <div style="position:relative">
        <img src="${v.img}" style="width:100%;height:220px;object-fit:cover">
        <button class="back" style="position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;background:rgba(0,0,0,.4)" onclick="switchTab('events')">‹</button>
        <div style="position:absolute;bottom:14px;left:16px;background:rgba(255,255,255,.95);color:var(--ink);font-size:12px;font-weight:800;padding:5px 11px;border-radius:8px">${EVENT_ICON[e.type]} ${e.type}</div>
      </div>
      <div class="pad">
        <h2 style="font-size:22px;font-weight:800">${e.title}</h2>
        <div class="vdrow"><span>📍 ${v.name}, ${v.area.replace(', London','')}</span></div>
        <div class="info-line"><span class="ic">🗓️</span><div><b>When</b>${e.date} · ${e.time}</div></div>
        <div class="info-line"><span class="ic">🍽️</span><div><b>Set menu</b>${e.menu} · £${e.menuPrice}pp</div></div>
        <div class="info-line"><span class="ic">👥</span><div><b>Who's coming</b>${e.going} going · ${e.spots-e.going} spots left · ages ${e.age}</div></div>
        <div class="info-line"><span class="ic">🎟️</span><div><b>Entry</b>Free with Yumble — you only pay for the menu on the night</div></div>
        <p class="h-sub" style="margin:14px 0">${e.desc}</p>
        <div style="background:#F0FBFA;border:1px solid #D8F0EC;border-radius:14px;padding:13px 15px;font-size:12.5px;color:#0C8073;line-height:1.5">🛡️ Every attendee is a verified Foodie. Hosted in a public venue with our team on hand.</div>
      </div>
      <div class="pad" style="padding-top:0">
        <button class="btn ${booked?'btn-dark':'btn-coral'}" onclick="bookEvent(${e.id})">${booked?'Going ✓ — tap to cancel':'Reserve free spot'}</button>
      </div>
    </div>`;
});
function bookEvent(id){const i=state.eventsBooked.indexOf(id);const e=EVENTS.find(x=>x.id===id);if(i<0){state.eventsBooked.push(id);awardBadge("social");toast("Spot reserved 🎟️");notify("Event booked 🎟️",`${e.title} · ${e.date} ${e.time}`);go("event",{id});}else{state.eventsBooked.splice(i,1);toast("Booking cancelled");go("event",{id});}}

/* ---------- RECOMMEND A RESTAURANT ---------- */
route("recommend",()=>`
  <div class="appbar"><button class="back" onclick="switchTab('explore')">‹</button><div class="script" style="font-size:20px">Recommend a spot</div></div>
  <div class="scroll pad">
    <p class="h-sub" style="margin-bottom:18px">Know a great restaurant that should be on Yumble? Tell us — we'll reach out to get them on board with offers for members.</p>
    <div class="field"><label>Restaurant name</label><input placeholder="e.g. Nonna's Kitchen"></div>
    <div class="field"><label>Area or postcode</label><input placeholder="e.g. Islington N1"></div>

    <div class="field"><label>Why do you love it? (optional)</label><input placeholder="Best carbonara in London"></div>
    <button class="btn btn-coral" onclick="toast('Thanks! We will check them out 🙌');switchTab('explore')">Send recommendation</button>

/* ---------- ID VERIFICATION (mimics Stripe Identity / Yoti) ---------- */
function startVerify(){go("verify1");}
route("verify1",()=>`
  <div class="appbar"><button class="back" onclick="enterApp()">‹</button><div class="script" style="font-size:20px">Get verified</div></div>
  <div class="scroll pad center" style="padding-top:20px">
    <div style="width:72px;height:72px;border-radius:50%;background:#F0FBFA;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:16px">🛡️</div>
    <h2 style="font-size:21px;font-weight:800;text-align:center">Verify you're really you</h2>
    <p class="h-sub" style="text-align:center;margin:8px 0 20px">Verified members get a blue tick, more matches, and access to events. It takes about a minute.</p>
    <div style="width:100%;text-align:left">
      <div class="info-line"><span class="ic">🤳</span><div><b>Step 1 — Selfie</b>A quick liveness selfie</div></div>
      <div class="info-line"><span class="ic">🪪</span><div><b>Step 2 — Photo ID</b>Passport or driving licence</div></div>
      <div class="info-line"><span class="ic">✅</span><div><b>Step 3 — Done</b>Usually verified in seconds</div></div>
    </div>
    <div style="background:#FFF6F6;border:1px solid #F8D7D7;border-radius:14px;padding:13px 15px;font-size:12px;color:var(--red-dark);line-height:1.5;margin-top:16px">🔒 Your ID is checked by our secure verification partner and never shown to other users or stored by Foodies.</div>
    <button class="btn btn-coral" style="margin-top:18px" onclick="go('verify2')">Start verification</button>
    <p class="h-sub" style="margin-top:12px;font-size:11px">Demo — connects to Stripe Identity / Yoti in the real app.</p>
  </div>`);
route("verify2",()=>`
  <div class="appbar"><button class="back" onclick="go('verify1')">‹</button><div class="script" style="font-size:20px">Step 1 — Selfie</div></div>
  <div class="scroll pad center" style="padding-top:20px">
    <div style="width:220px;height:280px;border-radius:20px;background:#12141a;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:18px">
      <div style="width:150px;height:190px;border:3px dashed rgba(255,255,255,.4);border-radius:50%"></div>
      <div style="position:absolute;bottom:14px;color:#fff;font-size:12px;opacity:.8">Position your face in the oval</div>
    </div>
    <p class="h-sub" style="text-align:center;margin-bottom:18px">Look straight at the camera and blink when asked.</p>
    <button class="btn btn-coral" onclick="verifyProgress()">📸 Capture selfie</button>
  </div>`);
function verifyProgress(){toast("Selfie captured ✓");go("verify3");}
route("verify3",()=>`
  <div class="appbar"><button class="back" onclick="go('verify2')">‹</button><div class="script" style="font-size:20px">Step 2 — Photo ID</div></div>
  <div class="scroll pad center" style="padding-top:20px">
    <div style="width:260px;height:165px;border-radius:16px;background:#F4F6F8;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:18px">
      <div style="font-size:38px">🪪</div>
      <div style="font-size:12px;color:var(--slate);margin-top:6px">Passport / Driving licence</div>
    </div>
    <div class="chips" style="justify-content:center;margin-bottom:18px">
      <span class="chip on">Passport</span><span class="chip">Driving licence</span><span class="chip">ID card</span>
    </div>
    <p class="h-sub" style="text-align:center;margin-bottom:18px">Make sure all four corners are visible and text is clear.</p>
    <button class="btn btn-coral" onclick="verifyDone()">📸 Scan ID</button>
  </div>`);
function verifyDone(){toast("ID scanned ✓");go("verifying");setTimeout(()=>{state.verified=true;me.badges.includes("verified")||me.badges.push("verified");go("verifydone");},2200);}
route("verifying",()=>`
  <div class="scroll center red-bg" style="padding:40px 30px;color:#fff">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="spinner"></div>
      <h2 style="font-size:20px;font-weight:800;margin-top:24px">Verifying…</h2>
      <p style="opacity:.9;font-size:14px;margin-top:8px">Our partner is checking your ID securely</p>
    </div>
  </div>`);
routes.verifying.red=true;
route("verifydone",()=>`
  <div class="scroll center red-bg" style="padding:40px 30px;color:#fff">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="width:82px;height:82px;border-radius:50%;background:#fff;color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:var(--shadow-lg)">✓</div>
      <h2 style="font-size:24px;font-weight:800;margin-top:22px">You're verified! 🎉</h2>
      <p style="opacity:.92;font-size:14px;margin-top:8px;text-align:center">Your profile now has a blue tick. Enjoy more matches and access to Foodie events.</p>
    </div>
    <button class="btn btn-white" onclick="enterApp()">Done</button>
  </div>`);
routes.verifydone.red=true;

else if(me.accountStatus==="approved"){ state.tab="discover"; go("app"); }
else { go("welcome"); }
